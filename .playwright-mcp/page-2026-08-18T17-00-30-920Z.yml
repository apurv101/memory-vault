              - paragraph [ref=e108]
              - heading [level=3] [ref=e292]:
                - generic [ref=e110]: "Please review the following job description:"
              - paragraph [ref=e113]
              - text: The Senior AI Agentic Engineer is a senior production builder responsible for designing, implementing, testing, and operating enterprise-grade agentic systems that solve real business problems at scale. This role sits at the center of the Forge delivery model, translating approved architecture patterns into production workflows that combine prompts, tools, APIs, memory, retrieval, orchestration logic, and human oversight into working enterprise capabilities. This is a hands-on senior engineering role focused on agent workflows, multi-step reasoning, prompt architecture, tool integration, memory/context management, retrieval-augmented generation (RAG), evaluation, observability, and governed deployment. The engineer works across platforms and frameworks used to deliver production AI capabilities, including Microsoft and Azure-based agent platforms, enterprise workflow tooling, and other approved agentic engineering stacks where needed. Daily work includes building agent flows, implementing orchestration logic, integrating APIs and enterprise systems, tuning prompts and execution patterns, validating output quality, hardening reliability, instrumenting observability, and supporting secure deployment through enterprise release controls. The role is expected to operate with senior-level ownership, production judgment, and deep technical accountability while still moving at startup speed inside enterprise governance.
              - paragraph [ref=e114]
              - paragraph [ref=e115]
              - paragraph [ref=e116]: Essential Duties and Responsibilities
              - paragraph [ref=e117]: Following is a summary of the essential functions for this job. Other duties may be performed, both major and minor, which are not mentioned below. Specific activities may change from time to time.
              - list [ref=e118]:
                - listitem [ref=e119]:
                  - paragraph [ref=e120]: Design, build, and deploy production-ready AI agents and agentic workflows that combine prompts, tools, APIs, memory, retrieval, and business logic into useful enterprise capabilities.
                - listitem [ref=e121]:
                  - paragraph [ref=e122]: Implement single-agent and multi-agent workflows using approved Forge patterns, including tool orchestration, supervisor-worker patterns, human-in-the-loop controls, session-aware execution, and safe fallback behaviors.
                - listitem [ref=e123]:
                  - paragraph [ref=e124]: Translate architecture and product intent into robust implementations that are observable, testable, secure, and maintainable in enterprise production environments.
                - listitem [ref=e125]:
                  - paragraph [ref=e126]: Build and maintain integrations to enterprise systems, APIs, workflow services, and governed data sources that enable agents to act safely and effectively within approved boundaries.
                - listitem [ref=e127]:
                  - paragraph [ref=e128]: Design and maintain prompt architectures, tool schemas, retrieval logic, memory behavior, and structured execution controls that improve agent accuracy, reliability, and explainability.
                - listitem [ref=e129]:
                  - paragraph [ref=e130]: Contribute to RAG, grounding, and knowledge-retrieval patterns using search, vector stores, document pipelines, and governed enterprise data services.
                - listitem [ref=e131]:
                  - paragraph [ref=e132]: Implement runtime controls for resilience and safety, including error handling, retries, tool constraints, structured outputs, human escalation, and observable execution behavior.
                - listitem [ref=e133]:
                  - paragraph [ref=e134]: Support evaluation and regression validation for agentic solutions, including prompt changes, model changes, workflow changes, and quality benchmarks tied to business outcomes.
                - listitem [ref=e135]:
                  - paragraph [ref=e136]: Use approved engineering acceleration tools to speed code generation, testing, refactoring, and documentation while remaining accountable for production quality and correctness.
                - listitem [ref=e137]:
                  - paragraph [ref=e138]: Write and maintain automated tests, integration validations, deployment-readiness checks, and runbooks for agent-enabled solutions and their supporting services.
                - listitem [ref=e139]:
                  - paragraph [ref=e140]: Partner with architecture, security, QA, product, data, platform, and enablement teams to move AI capabilities from design into reliable production delivery.
                - listitem [ref=e141]:
                  - paragraph [ref=e142]: Contribute reusable engineering patterns, reference implementations, and technical guidance that raise delivery quality and speed across the broader Forge engineering organization.
              - paragraph [ref=e143]: "Additional Needs:"
              - list [ref=e144]:
                - listitem [ref=e145]:
                  - paragraph [ref=e146]: 5+ years of software engineering experience, including strong hands-on experience building and supporting production systems in enterprise environments.
                - listitem [ref=e147]:
                  - paragraph [ref=e148]: Strong programming ability in Python and working knowledge of TypeScript, JavaScript, or another modern language commonly used in enterprise engineering stacks.
                - listitem [ref=e149]:
                  - paragraph [ref=e150]: Demonstrated experience building AI-enabled applications, prompt-driven workflows, orchestration logic, or agentic systems that move beyond simple chat responses.
                - listitem [ref=e151]:
                  - paragraph [ref=e152]: Experience integrating APIs, enterprise systems, workflow services, tools, and governed data sources into applications or automations with production-grade reliability.
                - listitem [ref=e153]:
                  - paragraph [ref=e154]: Strong understanding of prompt design, tool-calling, workflow branching, context handling, and engineering patterns required to make AI systems dependable in production.
                - listitem [ref=e155]:
                  - paragraph [ref=e156]: Experience with automated testing, CI/CD, code review, observability, and release controls in modern engineering organizations.
                - listitem [ref=e157]:
                  - paragraph [ref=e158]: Ability to work across architecture, implementation, reliability, security, and operational concerns instead of only isolated coding tasks.
                - listitem [ref=e159]:
                  - paragraph [ref=e160]: Strong written and verbal communication skills and the ability to operate effectively in cross-functional enterprise delivery teams.
              - paragraph [ref=e161]: Required Qualifications The requirements listed below are representative of the knowledge, skill and/or ability required. Reasonable accommodations may be made to enable individuals with disabilities to perform the essential functions.
              - list [ref=e162]:
                - listitem [ref=e163]:
                  - paragraph [ref=e164]: Bachelor’s degree in Computer Science, Software Engineering, or related field.
                - listitem [ref=e165]:
                  - paragraph [ref=e166]: Minimum of 7 years of professional experience in software development.
                - listitem [ref=e167]:
                  - paragraph [ref=e168]: Deep knowledge of multiple programming languages, software architecture, and design principles.
                - listitem [ref=e169]:
                  - paragraph [ref=e170]: Deep understanding of software development lifecycle, testing, deployment, and security practices.
              - paragraph [ref=e171]
              - paragraph [ref=e172]
              - paragraph [ref=e173]: PREFERRED QUALIFICATIONS
              - list [ref=e174]:
                - listitem [ref=e175]:
                  - paragraph [ref=e176]: Experience with enterprise agent platforms, workflow automation tools, or AI delivery stacks used for production business solutions.
                - listitem [ref=e177]:
                  - paragraph [ref=e178]: Experience with Microsoft, Azure, Copilot / Copilot Studio, Power Platform, or enterprise AI productivity and orchestration ecosystems.
                - listitem [ref=e179]:
                  - paragraph [ref=e180]: Experience with RAG, vector stores, retrieval pipelines, enterprise knowledge grounding, memory-aware agent behavior, or multi-agent collaboration patterns.
                - listitem [ref=e181]:
                  - paragraph [ref=e182]: Experience validating or tuning AI outputs for accuracy, consistency, policy adherence, and business usefulness in production-style scenarios.
                - listitem [ref=e183]:
                  - paragraph [ref=e184]: Experience in financial services, cybersecurity, risk-managed enterprise environments, or other heavily governed production settings.
                - listitem [ref=e185]:
                  - paragraph [ref=e186]: Experience mentoring other engineers, reviewing architecture or code quality, and functioning as a senior technical contributor with broad delivery impact.
                - listitem [ref=e187]:
                  - paragraph [ref=e188]: Experience working with observability, telemetry, production incident handling, and operational runbooks for complex AI-enabled systems.
